services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traceqa
      POSTGRES_USER: traceqa
      POSTGRES_PASSWORD: traceqa
    ports:
      - "5432:5432"
    volumes:
      - traceqa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traceqa -d traceqa" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-tut
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  traceqa-postgres:

