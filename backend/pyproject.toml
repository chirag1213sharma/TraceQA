[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceqa-backend"
version = "0.1.0"
description = "TraceQA test observability and predictive regression API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "h11>=0.16,<1.0",
    "httpx>=0.27,<1.0",
    "litellm>=1.74,<2.0",
    "markitdown[pdf]>=0.1,<1.0",
    "openai>=1.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.14,<2.0",
    "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
